<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#1E295F;
    color:#F4EFD8;
    font-family:'Pretendard','Malgun Gothic','맑은 고딕',system-ui,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 96px;box-sizing:border-box;
    position:relative;
  }
  /* 네이비에서 살짝 밝힌 결 — 브랜드 이미지가 아니라 면 처리 */
  body::after{
    content:'';position:absolute;inset:0;
    background:radial-gradient(1100px 520px at 88% -18%, rgba(115,146,228,.28), transparent 62%);
  }
  .wordmark{font-size:104px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .rule{width:132px;height:9px;background:#FEE4A2;border-radius:5px;margin:38px 0 34px}
  .tagline{font-size:52px;font-weight:600;letter-spacing:-.02em;line-height:1.35;color:#F4EFD8}
  .sub{margin-top:30px;font-size:31px;font-weight:500;color:#D5D0BC;line-height:1.5}
  .url{position:absolute;right:96px;bottom:64px;font-size:27px;font-weight:600;color:#7392E4}
</style>
<div class="wordmark">달나루</div>
<div class="rule"></div>
<div class="tagline">평생 경력, 다시 일이 되게</div>
<div class="sub">3분 대화로 기업에 바로 낼 이력서까지<br>서강대 연구실에서 시작한 5060 경력 서비스</div>
<div class="url">dalnaru.vercel.app</div>

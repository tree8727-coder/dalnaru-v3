<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>워크플로우 가이드 5.0 (Global Ranking)</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --bg-card: #1e293b;
            --cr: #f8fafc;
            --cr2: #94a3b8;
            --pr: #3b82f6;
            --ac: #8b5cf6;
            --yl: #fbbf24;
            --border: rgba(255,255,255,0.05);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: var(--cr); line-height: 1.6; overflow-x: hidden; }
        
        /* Top Navigation */
        .top-bar { position: sticky; top: 0; background: rgba(15,23,42,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 100; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { font-weight: 800; font-size: 1.4rem; color: #fff; letter-spacing: -0.5px; }
        .logo-area span { color: var(--yl); }

        .mode-toggle { display: flex; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 40px; padding: 4px; position: relative; }
        .toggle-btn { padding: 8px 24px; font-weight: 600; font-size: 0.95rem; color: var(--cr2); cursor: pointer; text-align: center; border-radius: 35px; transition: 0.3s; z-index: 2; }
        .toggle-btn.active { color: #fff; }
        .toggle-slider { position: absolute; top: 4px; left: 4px; height: calc(100% - 8px); width: calc(50% - 4px); background: var(--ac); border-radius: 35px; transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1; }

        .container { max-width: 1200px; margin: 0 auto; padding: 30px 20px; }
        
        /* 🔥 랭킹 섹션 시각화 (Podium) */
        .ranking-section { margin-bottom: 50px; background: radial-gradient(circle at top, rgba(139, 92, 246, 0.15), transparent 70%); padding: 40px 20px; border-radius: 24px; border: 1px solid rgba(139, 92, 246, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .section-title { text-align: center; font-size: 2.2rem; font-weight: 900; margin-bottom: 30px; letter-spacing: -1px; text-shadow: 0 2px 10px rgba(139,92,246,0.3); }
        .section-title span { color: var(--yl); }
        .podium-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: flex-end; }
        
        /* 랭킹 카드 */
        .rank-card { background: linear-gradient(145deg, #1e293b, #0f172a); border-radius: 20px; padding: 25px; text-align: center; position: relative; border: 1px solid rgba(255,255,255,0.1); transition: transform 0.3s, box-shadow 0.3s; }
        .rank-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        .rank-card.rank-1 { border-color: rgba(251,191,36,0.5); box-shadow: 0 0 30px rgba(251, 191, 36, 0.15); z-index: 3; padding-top: 40px; padding-bottom: 40px; margin-bottom: 0; }
        .rank-card.rank-2 { border-color: rgba(148,163,184,0.5); z-index: 2; margin-bottom: -20px; }
        .rank-card.rank-3 { border-color: rgba(180,83,9,0.5); z-index: 1; margin-bottom: -40px; }
        
        .crown { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 2.5rem; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
        .rank-badge { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.5); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1rem; }
        
        .rank-1 .rank-badge { color: var(--yl); }
        .rank-2 .rank-badge { color: #e2e8f0; }
        .rank-3 .rank-badge { color: #d97706; }
        
        .rank-card .icon { font-size: 3.5rem; margin-bottom: 10px; }
        .rank-card h3 { font-size: 1.2rem; color: #fff; margin-bottom: 10px; word-break: keep-all; }
        .rank-card .stars { color: var(--yl); font-weight: 800; font-size: 1.1rem; background: rgba(251,191,36,0.1); display: inline-block; padding: 4px 12px; border-radius: 20px; }
        
        /* 반응형 포디움 처리 */
        @media (max-width: 768px) {
            .podium-grid { grid-template-columns: 1fr; align-items: center; gap: 30px; }
            .rank-card { margin-bottom: 0 !important; padding-top: 30px !important; padding-bottom: 30px !important; }
            .rank-card.rank-1 { order: -1; }
        }

        /* 필터 칩 (검색 대체) */
        .filter-section { margin-bottom: 30px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 30px; }
        .filter-label { font-weight: 800; font-size: 1.2rem; margin-bottom: 15px; color: var(--cr); }
        .filter-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .filter-row::-webkit-scrollbar { display: none; }
        .chip { padding: 10px 24px; background: rgba(255,255,255,0.03); border-radius: 30px; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; white-space: nowrap; transition: all 0.2s; font-weight: 600; color: var(--cr2); letter-spacing: 0.5px; }
        .chip.active, .chip:hover { background: var(--ac); border-color: var(--ac); color: #fff; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }

        /* 메인 리스트 그리드 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
        .recipe-grid { display: grid; grid-template-columns: 1fr; gap: 24px; max-width: 800px; margin: 0 auto; }

        .quest-header { font-size: 1.6rem; color: var(--yl); font-weight: 800; margin: 40px 0 10px; padding-bottom: 10px; border-bottom: 1px dashed rgba(251, 191, 36, 0.3); display: none; }
        .bridge-text { background: rgba(139, 92, 246, 0.05); border-left: 4px solid var(--ac); padding: 16px 20px; border-radius: 0 12px 12px 0; font-size: 1.05rem; color: #e2e8f0; margin: 20px 0 30px; font-style: italic; display: none; }
        .bridge-text::before { content: '💁 큐레이터: '; font-weight: bold; font-style: normal; color: var(--ac); }

        /* 카드 상세 UI */
        .card { background: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s; position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.1); }
        
        .card-h { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 16px; }
        .card-i { font-size: 2.2rem; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; }
        .card-ti { font-size: 1.3rem; font-weight: 800; margin-bottom: 4px; color: #fff; letter-spacing: -0.5px; }
        .card-cat { font-size: 0.8rem; color: var(--pr); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(59,130,246,0.1); display: inline-block; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
        
        /* 뱃지 */
        .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .bdg { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; font-weight: 700; display: flex; align-items: center; gap: 4px; letter-spacing: 0.2px; }
        .bdg.diff-초급 { background: rgba(74,222,128,0.1); color: #4ADE80; border: 1px solid rgba(74,222,128,0.2); }
        .bdg.diff-중급 { background: rgba(251,191,36,0.1); color: #FBBF24; border: 1px solid rgba(251,191,36,0.2); }
        .bdg.diff-고급 { background: rgba(248,113,113,0.1); color: #F87171; border: 1px solid rgba(248,113,113,0.2); }

        .bdg.security { background: rgba(139,92,246,0.1); color: #C084FC; border: 1px solid rgba(139,92,246,0.2); }

        .code-label { font-size: 0.8rem; color: var(--cr2); margin-bottom: 8px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .code-box { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); font-family: Consolas, monospace; color: #a78bfa; font-size: 0.9rem; }

        .btn-copy { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; font-weight: 600; }

        .prompt-box { background: rgba(251, 191, 36, 0.05); border-left: 3px solid var(--yl); padding: 16px; border-radius: 0 8px 8px 0; margin-top: 10px; }

        .prompt-box p { color: #fde68a; font-style: italic; font-size: 0.95rem; margin: 0; font-weight: 600; }

    </style>

            });
        };

        // 랭킹 데이터 렌더링 함수
        const renderRanking = () => {
            const top1 = rawData.find(item => item.rank === 1);
            const top2 = rawData.find(item => item.rank === 2);
            const top3 = rawData.find(item => item.rank === 3);

            if(top1) document.getElementById('rank-1').innerHTML = `<div class="crown">👑</div><div class="rank-badge">1</div><div class="icon">${top1.icon}</div><h3>${top1.title}</h3><div class="stars">⭐ ${top1.stars}</div>`;
            if(top2) document.getElementById('rank-2').innerHTML = `<div class="rank-badge">2</div><div class="icon">${top2.icon}</div><h3>${top2.title}</h3><div class="stars">⭐ ${top2.stars}</div>`;
            if(top3) document.getElementById('rank-3').innerHTML = `<div class="rank-badge">3</div><div class="icon">${top3.icon}</div><h3>${top3.title}</h3><div class="stars">⭐ ${top3.stars}</div>`;
        };

        const setMode = (mode) => {
            const slider = document.getElementById('slider');
            const btnJob = document.getElementById('btn-job');
            const btnQuest = document.getElementById('btn-quest');
            const content = document.getElementById('content');
            const rankingSection = document.getElementById('ranking-section');
            const filterSection = document.getElementById('filter-section');
            
            if (mode === 'quest') {
                isQuestMode = true;
                slider.style.left = '50%';
                btnQuest.classList.add('active');
                btnJob.classList.remove('active');
                
                // 퀘스트 모드 시 랭킹과 칩 숨김
                document.body.classList.add('quest-mode');
                content.className = 'recipe-grid';
                rankingSection.style.display = 'none';
                filterSection.style.display = 'none';
                
            } else {
                isQuestMode = false;
                slider.style.left = '4px';
                btnJob.classList.add('active');
                btnQuest.classList.remove('active');
                
                // 직무 뷰 시 랭킹과 칩 복구
                document.body.classList.remove('quest-mode');
                content.className = 'grid';
                rankingSection.style.display = 'block';
                filterSection.style.display = 'block';
                activeCategory = "모두 보기";
                renderChips();
            }
            renderContent();
        };

        const renderChips = () => {
            const categories = ["모두 보기", ...new Set(rawData.map(item => item.job_category))];
            const chipsHtml = categories.map(cat => 
                `<div class="chip ${activeCategory === cat ? 'active' : ''}" 
                      onclick="filterCategory('${cat}')">${cat}</div>`
            ).join('');
            document.getElementById('filter-container').innerHTML = chipsHtml;
        };

        const filterCategory = (cat) => {
            activeCategory = cat;
            renderChips();
            renderContent();
        };

        const renderContent = () => {
            let displayData = [];
            
            if (isQuestMode) {
                displayData = sortedForQuest;
            } else {
                if (activeCategory !== "모두 보기") {
                    displayData = rawData.filter(item => item.job_category === activeCategory);
                } else {
                    displayData = rawData;
                }
            }
            
            let contentHtml = '';
            let currentQuestStep = -1;
            
            displayData.forEach((wf) => {
                if (isQuestMode && wf.quest_step !== currentQuestStep) {
                    currentQuestStep = wf.quest_step;
                    contentHtml += `<div class="quest-header">${wf.quest_title}</div>`;
                }

                contentHtml += `
                <div class="card">
                    <div class="card-h">
                        <div class="card-i">${wf.icon}</div>
                        <div>
                            <div class="card-cat">${wf.job_category}</div>
                            <div class="card-ti">${wf.title}</div>
                        </div>
                    </div>
                    
                    <div class="badges">
                        <span class="bdg diff-${wf.difficulty}">⚡ ${wf.difficulty}</span>
                        <span class="bdg price">💎 ${wf.price}</span>
                        <span class="bdg security">🛡️ 윙겟 검증</span>
                        <span class="bdg github">⭐ ${wf.stars}</span>
                    </div>
                    
                    <div class="card-desc">${wf.desc}</div>
                    
                    <div class="code-section">
                        <div class="code-label">🛠️ 다운로드 (터미널 복붙)</div>
                        <div class="code-box">
                            <div>${wf.install_cmd.replace(/\n/g, '<br>')}</div>
                            <button class="btn-copy" onclick="copyToClipboard(\`${wf.install_cmd}\`, this)">Copy</button>
                        </div>
                    </div>

                    <div class="code-section">
                        <div class="code-label">🚀 실행 명렁어</div>
                        <div class="code-box run">
                            <div>${wf.run_cmd}</div>
                            <button class="btn-copy" onclick="copyToClipboard(\`${wf.run_cmd}\`, this)">Copy</button>
                        </div>
                    </div>

                    <div class="prompt-box">
                        <div class="code-label">💡 AI 비즈니스 프롬프트</div>
                        <p>"${wf.prompt}"</p>
                    </div>
                </div>`;
                
                if (isQuestMode && wf.bridge_text) {
                    contentHtml += `<div class="bridge-text">${wf.bridge_text}</div>`;
                }
            });
            
            document.getElementById('content').innerHTML = contentHtml;
        };

        // 초기화
        renderRanking();
        renderChips();
        renderContent();
    </script>
</body>
</html>

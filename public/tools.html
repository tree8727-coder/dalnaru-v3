<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달나루 V30 - B2C 창업 AI 도구함</title>
<script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
:root { --bg:#0f172a; --bg-card:#1e293b; --cr:#f8fafc; --cr2:#94a3b8; --pr:#3b82f6; --ac:#8b5cf6; --yl:#fbbf24; }
* { box-sizing:border-box; font-family:'Pretendard', sans-serif; }
body { background:var(--bg); color:var(--cr); margin:0; padding:0; line-height:1.5; }
.top-bar { position:sticky; top:0; background:rgba(15,23,42,0.85); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,0.05); z-index:100; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
.logo-area { display:flex; align-items:center; gap:12px; font-weight:800; font-size:1.2rem; }
.logo-img { width:40px; height:40px; border-radius:10px; object-fit:cover; }
.h-btn { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:var(--cr); padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600; transition:all 0.2s; margin-left:8px; }
.h-btn:hover { background:rgba(255,255,255,0.1); }
.container { max-width:1200px; margin:0 auto; padding:20px; }

.search-box { width:100%; padding:16px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:var(--bg-card); color:var(--cr); font-size:1.1rem; margin-bottom:20px; transition:border-color 0.2s; }
.search-box:focus { outline:none; border-color:var(--ac); }

.filter-row { display:flex; gap:10px; overflow-x:auto; padding-bottom:10px; margin-bottom:20px; }
.chip { padding:8px 16px; background:rgba(255,255,255,0.05); border-radius:20px; border:1px solid rgba(255,255,255,0.1); cursor:pointer; white-space:nowrap; transition:all 0.2s; }
.chip.active, .chip:hover { background:var(--ac); border-color:var(--ac); color:#fff; }

.section-title { font-size:1.3rem; font-weight:800; margin:30px 0 16px 0; display:flex; align-items:center; gap:8px; }

/* Recipes */
.recipe-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; margin-bottom:30px; }
.recipe-card { background:linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); border:1px solid rgba(255,255,255,0.1); padding:20px; border-radius:16px; cursor:pointer; transition:transform 0.2s, border-color 0.2s; }
.recipe-card:hover { transform:translateY(-2px); border-color:var(--ac); }
.recipe-card h4 { margin:0 0 8px 0; font-size:1.1rem; color:var(--yl); }
.recipe-card p { margin:0; font-size:0.85rem; color:var(--cr2); }

/* Tools Grid */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:20px; }
.card { background:var(--bg-card); border:1px solid rgba(255,255,255,0.05); border-radius:16px; padding:20px; display:flex; flex-direction:column; transition:transform 0.2s, box-shadow 0.2s; }
.card:hover { transform:translateY(-4px); box-shadow:0 10px 25px -5px rgba(0,0,0,0.3); border-color:rgba(255,255,255,0.1); }
.card-h { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
.card-ti-area { display:flex; gap:12px; align-items:center; }
.card-i { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.card-ti { font-size:1.2rem; font-weight:700; margin:0 0 4px 0; }
.card-cat { font-size:0.75rem; color:var(--cr2); background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:4px; }
.card-bm { background:0; border:0; color:var(--cr2); cursor:pointer; font-size:1.5rem; transition:transform 0.1s; }
.card-bm.active { color:var(--yl); }
.card-bm:active { transform:scale(1.2); }
.card-desc { font-size:0.9rem; color:var(--cr2); flex-grow:1; margin-bottom:16px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

.badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
.bdg { font-size:0.7rem; padding:4px 8px; border-radius:4px; font-weight:600; }
.bdg.diff-1 { background:rgba(74,222,128,0.1); color:#4ADE80; }
.bdg.diff-2 { background:rgba(251,191,36,0.1); color:#FBBF24; }
.bdg.diff-3 { background:rgba(248,113,113,0.1); color:#F87171; }
.bdg.price { background:rgba(96,165,250,0.1); color:#60A5FA; }
.bdg.stage { background:rgba(192,132,252,0.1); color:#C084FC; }

.card-foot { display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.05); padding-top:12px; font-size:0.8rem; }
.card-score { display:flex; justify-content:space-between; width:100%; }

.btn-go { background:var(--pr); color:#fff; text-decoration:none; padding:8px 16px; border-radius:8px; font-weight:600; transition:background 0.2s; text-align:center; width:100%; display:block; border:none; cursor:pointer; }
.btn-go:hover { background:#2563eb; }

/* Modals */
.ov { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); z-index:999; display:none; align-items:center; justify-content:center; padding:20px; opacity:0; transition:opacity 0.2s; }
.ov.open { display:flex; opacity:1; }
.ov-bg { position:absolute; inset:0; }
.modal { background:var(--bg-card); width:100%; max-width:600px; border-radius:20px; z-index:1000; position:relative; max-height:90vh; display:flex; flex-direction:column; border:1px solid rgba(255,255,255,0.1); box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); transform:translateY(20px); transition:transform 0.2s; }
.ov.open .modal { transform:translateY(0); }
.modal-h { padding:20px 24px; border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center; }
.modal-h h3 { margin:0; font-size:1.2rem; }
.modal-body { padding:24px; overflow-y:auto; }
.modal-x { background:0; border:0; color:var(--cr2); font-size:1.5rem; cursor:pointer; }

/* Tool Form */
.c-input { width:100%; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:8px; color:var(--cr); margin-bottom:12px; font-size:1rem; }
.c-input:focus { outline:none; border-color:var(--ac); }

/* Steps */
.step { display:flex; gap:16px; margin-bottom:16px; align-items:flex-start; background:rgba(0,0,0,0.2); padding:16px; border-radius:12px; }
.step .sn { width:28px; height:28px; background:var(--ac); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; flex-shrink:0; }

.similar-card { display:flex; gap:12px; align-items:center; background:rgba(0,0,0,0.2); padding:12px; border-radius:12px; cursor:pointer; border:1px solid transparent; transition:all 0.2s; }
.similar-card:hover { border-color:rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); }

@keyframes spin { 100% { transform: rotate(360deg); } }
.spin { display:inline-block; animation: spin 2s linear infinite; }
</style>
</head>

  stepsEl.innerHTML = '';
  (r.steps || []).forEach((s, i) => {
    stepsEl.insertAdjacentHTML('beforeend', `<div class="step"><div class="sn">${i+1}</div><div class="st" style="font-size:0.95rem">${s.replace('스텝 '+(i+1)+': ','')}</div></div>`);
  });
  
  document.getElementById('ov-recipe').classList.add('open');
};
window.closeRecipe = () => document.getElementById('ov-recipe').classList.remove('open');

RECIPES.forEach((r, idx)=>{
  const d=document.createElement('div');d.className='recipe-card';
  d.innerHTML=`<h4>${r.name}</h4><p>${r.desc}</p>`;
  d.onclick=()=>{ openRecipe(idx) };
  rs.appendChild(d);
});

// Categories
const cats = [...new Set(DB.map(x=>x.cat1))];
cats.forEach(c => {
  const el = document.createElement('div'); el.className='chip'; el.textContent=ci(c).label;
  el.onclick = () => setF(c);
  document.getElementById('filters').appendChild(el);
});

window.setF = (c) => { curF = c; document.querySelectorAll('#filters .chip').forEach(el => el.classList.toggle('active', el.textContent === (c==='*'?'전체보기':ci(c).label))); applyFilters(); };
window.toggleDiff = () => { diffF = (diffF+1)%3; document.getElementById('diff-chip').textContent = diffF===0?'난이도: 전체':diffF===1?'난이도: 초보/쉬움':'난이도: 개발자/전문가'; document.getElementById('diff-chip').classList.toggle('active', diffF>0); applyFilters(); };
window.togglePrice = () => { priceF = (priceF+1)%3; document.getElementById('price-chip').textContent = priceF===0?'비용: 전체':priceF===1?'비용: 무료/오픈소스':'비용: 유료/구독'; document.getElementById('price-chip').classList.toggle('active', priceF>0); applyFilters(); };

const badgesHTML = (item) => {
  let h = '';
  if(item.diff===1) h+=`<span class="bdg diff-1">🌱 왕초보</span>`;
  else if(item.diff===3) h+=`<span class="bdg diff-3">🧑‍💻 개발자</span>`;
  else h+=`<span class="bdg diff-2">👍 일반</span>`;
  h+=`<span class="bdg price">${item.price==='free'?'🎁 무료':'💳 유료'}</span>`;
  h+=`<span class="bdg stage">🚩 ${item.stage}단계</span>`;
  return h;
};

window.toggleBM = (id, ev) => {
  ev.stopPropagation();
  const idx = BM.indexOf(id);
  if(idx>-1) BM.splice(idx,1); else BM.push(id);
  localStorage.setItem('dnBM', JSON.stringify(BM));
  applyFilters();
  if(document.getElementById('bm-modal').classList.contains('open')) openBM();
};

const renderCard = (item) => {
  const m = ci(item.cat1);
  return `<div class="card">
    <div class="card-h">
      <div class="card-ti-area">
        <div class="card-i" style="background:${m.color}20;color:${m.color}">${icon(m.icon)}</div>
        <div><h4 class="card-ti">${P.sanitize(item.title)}</h4><span class="card-cat">${m.label} · ${P.sanitize(item.cat2)}</span></div>
      </div>
      <button class="card-bm ${BM.includes(item.id)?'active':''}" onclick="toggleBM('${item.id}', event)">${BM.includes(item.id)?'★':'☆'}</button>
    </div>
    <div class="card-desc">${P.sanitize(item.desc)}</div>
    <div class="badges">${badgesHTML(item)}</div>
    <div class="card-foot">
      <div class="card-score">
        <span style="color:#A78BFA;font-weight:700">🚀 달나루 지수: ${item.d_score || 80}점</span>
        <span style="color:var(--yl)">⭐ 5.0</span>
      </div>
    </div>
    <a href="${item.link}" target="_blank" class="btn-go" style="margin-top:16px;" onclick="logClick('${item.cat1}')">바로가기</a>
  </div>`;
};

window.logClick = (c) => { CL[c] = (CL[c]||0)+1; localStorage.setItem('dnClicks', JSON.stringify(CL)); };

window.applyFilters = () => {
  const q = document.getElementById('q').value;
  let res = q ? fuse.search(q).map(x=>x.item) : DB;
  
  if(curF !== '*') res = res.filter(x => x.cat1 === curF);
  if(diffF === 1) res = res.filter(x => x.diff === 1);
  if(diffF === 2) res = res.filter(x => x.diff === 3);
  if(priceF === 1) res = res.filter(x => x.price === 'free');
  if(priceF === 2) res = res.filter(x => x.price === 'paid');
  
  document.getElementById('g').innerHTML = res.length ? res.map(renderCard).join('') : '<p style="text-align:center;width:100%;color:var(--cr2)">결과가 없습니다.</p>';
  
  // Recommend
  const rw = document.getElementById('rec-wrap');
  if(Object.keys(CL).length > 0 && !q && curF==='*') {
    const topCat = Object.keys(CL).reduce((a,b)=>CL[a]>CL[b]?a:b);
    document.getElementById('rec-reason').innerHTML = `💡 회원님이 최근 <b>'${ci(topCat).label}'</b> 도구를 많이 찾아보셨네요! 시너지를 낼 수 있는 추천 도구들입니다.`;
    const recs = DB.filter(x => x.cat1 === topCat && !BM.includes(x.id)).slice(0,3);
    if(recs.length) {
      rw.style.display = 'block';
      document.getElementById('rec-s').innerHTML = recs.map(renderCard).join('');
    } else rw.style.display = 'none';
  } else rw.style.display = 'none';
};

document.getElementById('q').addEventListener('input', applyFilters);

// BM
window.openBM = () => {
  const list = document.getElementById('b-list');
  const items = BM.map(id => DB.find(x=>x.id===id)).filter(Boolean);
  list.innerHTML = items.length ? items.map(x => `<div class="similar-card" style="justify-content:space-between">
    <div style="display:flex;gap:12px;align-items:center"><div class="card-i" style="background:${ci(x.cat1).color}20;color:${ci(x.cat1).color};width:32px;height:32px;border-radius:8px">${icon(ci(x.cat1).icon,16)}</div>
    <div><h5 style="margin:0">${P.sanitize(x.title)}</h5><a href="${x.link}" target="_blank" style="font-size:0.75rem;color:#3b82f6;text-decoration:none">바로가기</a></div></div>
    <button onclick="toggleBM('${x.id}', event)" style="background:0;border:0;color:var(--yl);cursor:pointer;font-size:1.5rem">★</button>
  </div>`).join('') : '<p style="text-align:center;color:var(--cr2)">저장된 레시피가 없습니다.</p>';
  document.getElementById('bm-modal').classList.add('open');
};
window.closeBM = () => document.getElementById('bm-modal').classList.remove('open');

// Security Check
window.closeAddTool = () => {
  document.getElementById('add-tool-modal').classList.remove('open');
  document.getElementById('at-step1').style.display = 'block';
  document.getElementById('at-step2').style.display = 'none';
  document.getElementById('at-progress').style.width = '0%';
};
window.runSecurityCheck = () => {
  const url = document.getElementById('at-url').value;
  const name = document.getElementById('at-name').value;
  if(!url || !name) return alert('모든 항목을 입력해주세요.');
  if(url.includes('.exe') || url.includes('.zip')) return alert('⚠️ 경고: 직접 다운로드 파일은 보안 정책상 등록 제한됩니다.');
  
  document.getElementById('at-step1').style.display = 'none';
  document.getElementById('at-step2').style.display = 'block';
  
  setTimeout(() => { document.getElementById('at-progress').style.width = '40%'; }, 100);
  setTimeout(() => { document.getElementById('at-progress').style.width = '80%'; }, 800);
  setTimeout(() => {
    document.getElementById('at-progress').style.width = '100%';
    setTimeout(() => {
      alert('✅ 안전성 검사 통과!\n현재는 커뮤니티 서버 연결 전이므로 로컬에 임시 등록됩니다.');
      const newTool = {
        id: 'user_' + Date.now(), cat1: '기타', cat2: '유저 등록',
        title: name, desc: document.getElementById('at-desc').value, link: url,
        diff: 2, price: 'free', form: 'web', stage: '아이디어', compat: ['web'], d_score: 85
      };
      DB.unshift(newTool);
      BM.push(newTool.id);
      localStorage.setItem('dnBM', JSON.stringify(BM));
      closeAddTool(); applyFilters();
    }, 500);
  }, 1500);
};

applyFilters();
</script>
</body>
</html>
